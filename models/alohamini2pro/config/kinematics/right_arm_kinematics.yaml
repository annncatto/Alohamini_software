    - {joint: right_wrist_yaw_joint, axis: [-0.000003673205, 0.000000075981, -0.999999999993, 0.127078632942, -0.000966824031, -0.000000466859]}
    - {joint: right_wrist_roll,      axis: [-0.000000000001, -1.0, -0.000000152585, 0.135422251941, -0.000000000148, 0.000966326598]}
  home_transform_M:
