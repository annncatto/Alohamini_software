[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "alohamini-platform"
version = "0.1.0.dev0"
description = "Framework-independent AlohaMini robot interfaces"
readme = "README.md"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
zmq = ["pyzmq>=22"]
feetech = ["feetech-servo-sdk==1.0.0", "pyserial==3.5"]
audio-debug = ["sounddevice==0.5.5"]
host = [
    "pyzmq>=22",
    "feetech-servo-sdk==1.0.0",
    "pyserial==3.5",
    "numpy>=2,<3",
    "opencv-python-headless==4.13.0.92",
]

[project.scripts]
alohamini = "alohamini.cli:main"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
