[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "alohamini-platform"
version = "0.1.0.dev0"
description = "Framework-independent AlohaMini robot interfaces"
readme = "README.md"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
smolvla = ["alohamini-platform[learning]", "transformers==5.0.0", "num2words==0.5.14", "typing-extensions>=4.10"]
pi05 = ["alohamini-platform[learning]", "transformers==5.0.0", "sentencepiece==0.2.0"]
learning = [
    "accelerate==1.15.0",
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
    "einops==0.8.2",
    "safetensors==0.8.0",
    "numpy>=2,<3",
    "pyarrow>=18",
    "opencv-python-headless==4.13.0.92",
    "pillow>=11",
]
notebook = ["nbformat==5.10.4", "nbclient==0.10.2", "ipykernel==6.30.1", "matplotlib==3.10.8"]
zmq = ["pyzmq>=22"]
feetech = ["feetech-servo-sdk==1.0.0", "pyserial==3.5"]
audio-debug = ["sounddevice==0.5.5"]
joycon = [
    "pyzmq>=22",
    "joycon-robotics @ git+https://github.com/box2ai-robotics/joycon-robotics.git@6f87e3b7055c1defd63d139df8b24c571825b938",
]
host = [
    "pyzmq>=22",
    "feetech-servo-sdk==1.0.0",
    "pyserial==3.5",
    "numpy>=2,<3",
    "opencv-python-headless==4.13.0.92",
]

[project.scripts]
alohamini = "alohamini.cli:main"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Keep copied upstream model comments intact for source comparison.
"src/alohamini/policies/act/*.py" = ["E501"]
"src/alohamini/policies/am_act/*.py" = ["E501"]
"src/alohamini/policies/smolvla/*.py" = ["E501"]
"integrations/lerobot/src/alohamini_lerobot/policies/**/*.py" = ["E501"]
"integrations/lerobot/src/alohamini_lerobot/train.py" = ["E501"]
